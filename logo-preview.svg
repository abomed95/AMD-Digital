<svg xmlns="http://www.w3.org/2000/svg" width="280" height="80" viewBox="0 0 280 80">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066ff"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#00d4ff"/>
    </linearGradient>
    <rect id="bg" width="280" height="80" rx="16" fill="#0a0f1e"/>
  </defs>

  <!-- Dark background -->
  <use href="#bg"/>

  <!-- Icon box: 42x42, gradient, rounded 10px, centered vertically -->
  <rect x="19" y="19" width="42" height="42" rx="10" fill="url(#iconGrad)"/>

  <!-- AMD text inside icon -->
  <text x="40" y="47" text-anchor="middle"
        font-family="Arial Black, Arial, sans-serif"
        font-weight="900" font-size="13" fill="white" letter-spacing="0.5">AMD</text>

  <!-- "AMD Digital" text -->
  <text x="73" y="47" text-anchor="start"
        font-family="Arial, sans-serif"
        font-weight="700" font-size="22" fill="url(#textGrad)">AMD Digital</text>
</svg>
