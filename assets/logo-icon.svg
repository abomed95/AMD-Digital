<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" fill="none">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0055ee"/>
      <stop offset="55%" stop-color="#3311bb"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>

    <!-- Line gradient -->
    <linearGradient id="lineGrad" x1="10" y1="50" x2="50" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(255,255,255,0.7)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,1)"/>
    </linearGradient>

    <!-- Apex glow filter -->
    <filter id="apexGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Node glow filter -->
    <filter id="nodeGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Shimmer gradient for top highlight -->
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>

    <!-- Clip for rounded corners -->
    <clipPath id="roundClip">
      <rect width="60" height="60" rx="14"/>
    </clipPath>
  </defs>

  <!-- ── Background ── -->
  <rect width="60" height="60" rx="14" fill="url(#bgGrad)"/>

  <!-- Subtle top-left shine -->
  <rect width="60" height="60" rx="14" fill="url(#shine)"/>

  <!-- Thin inner border -->
  <rect x="0.75" y="0.75" width="58.5" height="58.5" rx="13.5"
        stroke="rgba(255,255,255,0.12)" stroke-width="1.5" fill="none"/>

  <!-- ── Decorative circuit dots (corners) ── -->
  <circle cx="8" cy="8" r="1.2" fill="rgba(255,255,255,0.15)"/>
  <circle cx="52" cy="8" r="1.2" fill="rgba(255,255,255,0.15)"/>
  <circle cx="8" cy="52" r="1.2" fill="rgba(255,255,255,0.15)"/>
  <circle cx="52" cy="52" r="1.2" fill="rgba(255,255,255,0.15)"/>
  <!-- Corner tick marks -->
  <line x1="8" y1="12" x2="8" y2="16" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-linecap="round"/>
  <line x1="4" y1="8" x2="8" y2="8" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-linecap="round"/>
  <line x1="52" y1="12" x2="52" y2="16" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-linecap="round"/>
  <line x1="52" y1="8" x2="56" y2="8" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-linecap="round"/>

  <!-- ── "A" Neural network mark ── -->

  <!-- Left leg (A left side) -->
  <line x1="30" y1="10" x2="10" y2="51"
        stroke="url(#lineGrad)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Right leg (A right side) -->
  <line x1="30" y1="10" x2="50" y2="51"
        stroke="url(#lineGrad)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Crossbar (cyan) -->
  <line x1="19.5" y1="34.5" x2="40.5" y2="34.5"
        stroke="#00d4ff" stroke-width="2" stroke-linecap="round"/>

  <!-- Subtle base horizontal line -->
  <line x1="10" y1="51" x2="50" y2="51"
        stroke="rgba(255,255,255,0.18)" stroke-width="1.5" stroke-linecap="round"
        stroke-dasharray="2 4"/>

  <!-- ── Nodes ── -->

  <!-- Apex node — cyan, animated pulse -->
  <circle cx="30" cy="10" r="4.5" fill="#00c8ff" filter="url(#apexGlow)"/>
  <circle cx="30" cy="10" r="2.5" fill="white"/>

  <!-- Apex pulse ring animation -->
  <circle cx="30" cy="10" r="4.5" fill="none" stroke="#00d4ff" stroke-width="1.2">
    <animate attributeName="r" from="4.5" to="13" dur="2.4s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" from="0.7" to="0" dur="2.4s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="30" cy="10" r="4.5" fill="none" stroke="#00d4ff" stroke-width="0.8">
    <animate attributeName="r" from="4.5" to="13" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" from="0.5" to="0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Crossbar left node -->
  <circle cx="19.5" cy="34.5" r="3" fill="#00d4ff" filter="url(#nodeGlow)"/>
  <circle cx="19.5" cy="34.5" r="1.5" fill="white"/>

  <!-- Crossbar right node -->
  <circle cx="40.5" cy="34.5" r="3" fill="#00d4ff" filter="url(#nodeGlow)"/>
  <circle cx="40.5" cy="34.5" r="1.5" fill="white"/>

  <!-- Bottom-left node -->
  <circle cx="10" cy="51" r="3.2" fill="rgba(255,255,255,0.85)" filter="url(#nodeGlow)"/>

  <!-- Bottom-right node -->
  <circle cx="50" cy="51" r="3.2" fill="rgba(255,255,255,0.85)" filter="url(#nodeGlow)"/>
</svg>
